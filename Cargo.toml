[package]
name = "image-studio"
version = "0.2.9"
edition = "2024"
build = "build.rs"

[[bin]]
name = "ImageStudio"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
rfd = "0.15"
arboard = "3.4"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
sevenz-rust2 = "0.24.0"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
strip = true

